spring.application.name=aives-backend
server.port=${PORT:8080}

# Multipart upload limits (PDF syllabus can be up to ~15MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=2MB

# Database Configuration (PostgreSQL with pgvector)
spring.datasource.url=jdbc:postgresql://localhost:5432/aives_db
spring.datasource.username=aives_user
spring.datasource.password=aives_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.signer-key=S7RxfF0UMgBdOAfHdDjklZm7lF3rTLjqWNrDgcXsNqm8Yw3KeVf9aHbPnYcXzJhQ
jwt.expiration=3600
jwt.reset-token-expiration=900
jwt.activation-expiration=86400

# Swagger / SpringDoc OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# AI API Configurations (RAG, Viva Q&A evaluation)
groq.api.key=${GROQ_API_KEY:dummy_key}
gemini.api.key=${GEMINI_API_KEY:}

# Gemini text models - primary + ordered fallback chain (tried when primary fails with 503/404)
# NOTE: gemini-flash-latest and gemini-2.x/1.5-flash are no longer served by Google (503/404)
gemini.text.model=gemini-3.5-flash
gemini.fallback.models=gemini-3.5-flash-lite,gemini-3-flash-preview,gemini-3.1-flash-lite

# Gemini embedding - text-embedding-004 was retired (404); gemini-embedding-001 supports
# outputDimensionality so we can request exactly 1536 to match the vector(1536) DB column
gemini.embedding.model=gemini-embedding-001
gemini.embedding.dimensions=1536

# Mail Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:minhndkse182351@fpt.edu.vn}
spring.mail.password=${MAIL_PASSWORD:gnzrwquezlhsdezu}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.mail.from-name=AIVES Examination System
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Timezone
spring.jackson.time-zone=Asia/Ho_Chi_Minh
