spring.application.name=aives-backend
server.port=${PORT:8080}

# Database Configuration (PostgreSQL with pgvector)
spring.datasource.url=jdbc:postgresql://localhost:5432/aives_db
spring.datasource.username=aives_user
spring.datasource.password=aives_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.signer-key=S7RxfF0UMgBdOAfHdDjklZm7lF3rTLjqWNrDgcXsNqm8Yw3KeVf9aHbPnYcXzJhQ
jwt.expiration=3600
jwt.reset-token-expiration=900

# Swagger / SpringDoc OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# AI API Configurations (RAG, Viva Q&A evaluation)
groq.api.key=${GROQ_API_KEY:dummy_key}
gemini.api.key=${GEMINI_API_KEY:dummy_key}

# Mail Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:contact.aives@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy_mail_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

