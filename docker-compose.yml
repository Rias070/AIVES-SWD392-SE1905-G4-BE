version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aives_postgres
    restart: always
    environment:
      POSTGRES_DB: aives_db
      POSTGRES_USER: aives_user
      POSTGRES_PASSWORD: aives_password
    ports:
      - "5432:5432"
    volumes:
      - aives_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  aives_pgdata:
